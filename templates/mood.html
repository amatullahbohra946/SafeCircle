<!DOCTYPE html>
<html>
    <head>
        <title>SafeCircle - Mood Tracker</title>
        <style>
            body {
                font-family: Arial,  sans-serif;
                background-color: #f3f6ff;
                text-align: center;
                padding-top: 70px;

            }
            .mood-box {
                background-color: #f3f6ff;
                color: #333;
                border: 1px solid#ddd;
                padding: 12px 18px;
                margin: 6px;
                border-radius: 20px;
                cursor: pointer;
                font-size: 15px;
            }
            .mood-button:hover {
                background-color: #e3e5ff;
            }
        </style>
    </head>
    <body>
        <h1>SafeCircle</h1>
        <h2>How are You Feeling today?</h2>
        <div>
            <button>😀 Happy</button>
            <button>🙂 okay</button>
            <button>😞 sad</button>
            <button>😡 Angry</button>
            <button>😰 Anxious</button>
        </div>
    </body>

</html>
