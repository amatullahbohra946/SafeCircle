<!Doctype html>
<html>
    <head>
        <title>SafeCircle - Register</title>
        <style>
            body {
                font-family: Arial,  sans-serif;
                background-color: #f3f6ff;
                text-align: center;
                padding-top: 60px;
            }
            .register-box {
                background-color: white;
                width: 350px;
                margin: auto;
                padding: 30px;
                border-radius: 15px;
            }  
            h1 {
                color: 5b5fc7;
            }  
            input {
                width: 90%;
                padding: 12px;
                margin : 8px;
                border: 1px solid #ccc;
                border-radius:8px ;
                box-sizing: border-box;
            }
            button {
                background-color: #5b5fc7;
                color: white;
                border: none;
                padding: 12px 30px;
                border-radius: 20px;
                cursor: pointer;
                margin-top: 10px;
            }
            p {
                color: #555;
            }
        </style>

    </head>
    <body>
        <div class="register-box">
        <h1>SafeCircle</h1>
        <h2>Create Account</h2>

        <input type ="email"
    placeholder="Enter your email">
         <br>
        <input type="password"
    placeholder="Create Password">
         <br>
        <input type="password"
    placeholder="Confirm Password">
        <br>
        <input type="number"
    placeholder="Enter your age">
        <br>
         <input type="number"
    placeholder="Confirm Age">     
        <br>    
        <input type="text"
    placeholder="Choose an anonymous username">
        <br>
        <a href="community.html">
        <button>Register</button>
        </a>
        
        </div>
    </body>
</html>
