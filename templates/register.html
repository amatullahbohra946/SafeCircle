
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeCircle - Create Account</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            color: #f5f3ff;
            background:
                radial-gradient(ellipse at 50% 80%,
                    #465c91 0%, #202d55 42%,
                    #10172f 75%, #080d1d 100%);
        }

        .sky {
            position: relative;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 18px;
            overflow: hidden;
        }

        .moon {
            position: absolute;
            top: 7%;
            right: 12%;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: #fff3d4;
            box-shadow: 0 0 45px #fff0c455;
        }

        .stars {
            position: absolute;
            top: 12%;
            left: 10%;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: white;
            box-shadow:
                120px 80px #ffffff,
                260px 30px #ffffffaa,
                400px 140px #ffffff,
                550px 60px #ffffffaa,
                700px 170px #ffffff,
                850px 40px #ffffffaa,
                100px 350px #ffffff;
        }

        .register-box {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 430px;
            padding: 35px;
            border: 1px solid #ffffff30;
            border-radius: 25px;
            background: #111a35dc;
            box-shadow: 0 20px 70px #00000035;
            backdrop-filter: blur(8px);
        }

        .brand {
            text-align: center;
            color: #c7d5ff;
            font-size: 13px;
            letter-spacing: 4px;
            margin-bottom: 12px;
        }

        h1 {
            text-align: center;
            color: #ffffff;
            font-size: 35px;
            margin-bottom: 8px;
        }

        h2 {
            text-align: center;
            color: #c8d5ff;
            font-size: 20px;
            font-weight: normal;
            margin-bottom: 25px;
        }

        input {
            display: block;
            width: 100%;
            padding: 13px 15px;
            margin: 12px 0;
            border: 1px solid #ffffff35;
            border-radius: 10px;
            background: #ffffff0d;
            color: white;
            font-size: 14px;
            outline: none;
        }

        input::placeholder {
            color: #c0c9e1;
        }

        input:focus {
            border-color: #b8caff;
        }

        button {
            width: 100%;
            margin-top: 12px;
            padding: 14px;
            border: none;
            border-radius: 25px;
            background: #f7f3e8;
            color: #182344;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #dce5ff;
            transform: translateY(-2px);
        }

        .message {
            color: #ffe0b2;
            text-align: center;
            margin-bottom: 12px;
        }

        .login-link {
            margin-top: 22px;
            text-align: center;
            color: #d2d9ee;
            font-size: 14px;
            line-height: 1.8;
        }

        a {
            color: #d6e0ff;
        }

        .hill {
            position: absolute;
            bottom: -150px;
            left: -10%;
            width: 120%;
            height: 230px;
            border-radius: 50% 50% 0 0;
            background: linear-gradient(#25385c, #111b32);
        }

        @media (max-width: 480px) {
            .register-box {
                padding: 28px 22px;
            }

            .moon {
                width: 55px;
                height: 55px;
            }
        }
        label {
    font-size: 12px;
    font-weight: normal;
}
    </style>
</head>

<body>
    <main class="sky">
        <div class="moon"></div>
        <div class="stars"></div>
        <div class="hill"></div>

        <section class="register-box">
            <div class="brand">EVERYONE UNDER THE SAME SKY</div>

            <h1>SafeCircle</h1>
            <h2>Create your account</h2>

            <form method="POST">
                {% csrf_token %}

                {% if messages %}
                    {% for message in messages %}
                        <p class="message">{{ message }}</p>
                    {% endfor %}
                {% endif %}

                <input type="email"
                       name="email"
                       placeholder="Enter your email"
                       required>

                <input type="password"
                       name="password"
                       placeholder="Create password"
                       required>

                <input type="password"
                       name="confirm_password"
                       placeholder="Confirm password"
                       required>

                

<label for="date_of_birth">Enter your DOB (DD-MM-YYYY)</label>
<input
    type="date"
    name="date_of_birth"
    id="date_of_birth"
    required
>

<label for="confirm_date_of_birth">Confirm your DOB (DD-MM-YYYY)</label>
<input
    type="date"
    name="confirm_date_of_birth"
    id="confirm_date_of_birth"
    required
>

                <button type="submit">Create Account →</button>
            </form>

            <p class="login-link">
                Already have an account?
                <a href="{% url 'login' %}">Login</a>
            </p>
        </section>
    </main>
</body>
</html>
