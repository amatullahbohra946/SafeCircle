<!DOCTYPE html>
<html>
    <head>
        <title>SafeCircle - Login</title>
        <style>
            body {
                font-family: Arial,  sans-serif;
                background-color: #f3f6ff;
                text-align: center;
                padding-top: 100px;
            }
            .login-box {
                background-color: white;
                width: 350px;
                margin: auto;
                padding: 30px; 
                border-radius: 15px;

            }
            h1 {
                color : #5b5fc7;
            }
            input {
                width : 90% ;
                padding: 12px ;
                margin: 10px;
                border: 1px solid #ccc;
                border-radius: 8px;
                
            }
            button {
                background-color: #5b5fc7;
                color: white;
                border: none;
                padding: 12px 30px;
                border-radius: 20px;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <div class="login-box">
            <h1>SafeCircle</h1>
            <h2>Login</h2>
            <input type="email"
    placeholder="Enter your email">
            <input type="password"
    placeholder="Enter your password">
        <br>
        <button>Login</button>
        <p>Don't have an account?<a href="register.html">Register</a></p>

        </div>
    </body>
</html>
